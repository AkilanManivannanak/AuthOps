[project]
name = "authops"
version = "0.1.0"
description = "Prior-authorization agent operations: document intelligence, validation, browser/phone/FHIR agents, experiments and QA."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2", "fastapi", "uvicorn", "python-multipart", "playwright", "pytesseract", "pillow",
  "pyotp", "pyyaml", "httpx",
]
[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest", "ruff==0.16.9", "fhir.resources>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["tests_ui/runs"]

[tool.ruff.lint]
# Explicit, so `ruff check .` gives the same answer on every ruff version (pinned in dev extras and CI).
select = ["E", "F", "W"]
ignore = ["E501"]
