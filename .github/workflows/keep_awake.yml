name: keep app awake

# Community Cloud hibernates an app after 12 hours without a visit. A real browser visit every
# 6 hours keeps the live demo warm, so the first person to open the link sees the app, not a
# wake-up screen.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.* && python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py https://akilan-silna-pa-agent.streamlit.app
